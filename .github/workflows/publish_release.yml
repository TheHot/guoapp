name: Publish iOS artifact to release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 40686734413 -R TheHot/guoapp -n zhenguojian-ios -D ios_artifacts
          gh release upload app-v0.2.64-71 ios_artifacts/* --clobber -R TheHot/guoapp